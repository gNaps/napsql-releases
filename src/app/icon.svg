<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="napsql">
  <!-- Vector replica of the application icon (napsql/build/icon.png): same
       rounded square, same green, same N, traced from the 1024px original.
       A few hundred bytes instead of a 1024px PNG, and sharp at every tab size. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36D3A6" />
      <stop offset="1" stop-color="#2BB893" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="200" fill="url(#g)" />
  <path
    d="M346 722V302l332 420V302"
    fill="none"
    stroke="#08231C"
    stroke-width="74"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
